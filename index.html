<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Match Simulation</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080b12;
            color: white;
        }

        /* HEADER */

        header {
            background: #111827;
            padding: 18px;
            text-align: center;
            border-bottom: 2px solid #273449;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 6px 0 0;
            color: #9ca3af;
        }

        /* MAIN */

        .container {
            width: 95%;
            max-width: 900px;
            margin: 25px auto;
        }

        /* VIDEO */

        .video-box {
            height: 300px;
            background: #151b27;
            border: 2px solid #303b50;
            border-radius: 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
            color: #8b95a7;

            margin-bottom: 20px;
        }

        /* MATCH INFORMATION */

        .match-info {
            background: #111827;
            border-radius: 12px;
            padding: 15px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .status {
            font-size: 18px;
            font-weight: bold;
        }

        .timer {
            font-size: 22px;
            font-weight: bold;
        }

        /* TEAMS */

        .teams {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            align-items: center;
        }

        .team {
            background: #111827;
            border: 2px solid #263246;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
        }

        .team h2 {
            margin: 5px 0 10px;
            font-size: 25px;
        }

        .team-icon {
            font-size: 55px;
        }

        .label {
            color: #9ca3af;
            margin-bottom: 5px;
        }

        .amount {
            font-size: 30px;
            font-weight: bold;
            margin: 8px 0 20px;
        }

        /* VS */

        .vs {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
        }

        /* BUTTON */

        .bet {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .bet:hover {
            opacity: 0.85;
        }

        .bet:disabled {
            background: #374151;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* SELECTION */

        .selection {
            background: #111827;
            border-radius: 10px;
            padding: 15px;
            text-align: center;

            margin-top: 20px;

            color: #d1d5db;
        }

        /* RESULT */

        .result {
            text-align: center;
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        /* START BUTTON */

        .start {
            display: block;
            margin: 25px auto 10px;

            padding: 15px 35px;

            border: none;
            border-radius: 8px;

            background: white;
            color: #111827;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .start:hover {
            opacity: 0.85;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .teams {
                grid-template-columns: 1fr auto 1fr;
                gap: 7px;
            }

            .team {
                padding: 15px 8px;
            }

            .team-icon {
                font-size: 40px;
            }

            .team h2 {
                font-size: 19px;
            }

            .amount {
                font-size: 20px;
            }

            .bet {
                font-size: 12px;
                padding: 11px 5px;
            }

            .vs {
                font-size: 20px;
            }

            .video-box {
                height: 220px;
            }
        }

    </style>
</head>

<body>

<header>

    <h1>🎮 GAME MATCH</h1>

    <p>Online Game Match Simulation</p>

</header>


<div class="container">


    <!-- GAME VIDEO -->

<div class="video-box">
    <iframe
        width="100%"
        height="300px"
        src="mhn.mp4"
        title="Game Video"
        frameborder="0"
        allowfullscreen>
    </iframe>
</div>


    <!-- STATUS AND TIMER -->

    <div class="match-info">

        <div class="status" id="status">
            🟢 OPEN
        </div>

        <div class="timer">
            ⏱️ <span id="timer">30</span>s
        </div>

    </div>


    <!-- TEAM A VS TEAM B -->

    <div class="teams">


        <!-- TEAM A -->

        <div class="team">

            <div class="team-icon">
                🛡️
            </div>

            <h2>TEAM A</h2>

            <div class="label">
                Demo Credits
            </div>

            <div class="amount" id="teamA">
                0
            </div>

            <button
                class="bet"
                id="betA"
                onclick="selectTeam('Team A')">

                BET TEAM A

            </button>

        </div>


        <!-- VS -->

        <div class="vs">
            VS
        </div>


        <!-- TEAM B -->

        <div class="team">

            <div class="team-icon">
                ⚔️
            </div>

            <h2>TEAM B</h2>

            <div class="label">
                Demo Credits
            </div>

            <div class="amount" id="teamB">
                0
            </div>

            <button
                class="bet"
                id="betB"
                onclick="selectTeam('Team B')">

                BET TEAM B

            </button>

        </div>

    </div>


    <!-- SELECTION -->

    <div class="selection" id="selection">

        No team selected

    </div>


    <!-- RESULT -->

    <div class="result" id="result"></div>


    <!-- START -->

    <button
        class="start"
        onclick="startMatch()">

        ▶ START NEW MATCH

    </button>

</div>


<script>

let teamA = 0;
let teamB = 0;

let matchTime = 30;

let timer;


/* RANDOM DEMO CREDITS */

function randomAmount() {

    return Math.floor(
        100000 +
        Math.random() * 9000000
    );

}


/* START MATCH */

function startMatch() {

    clearInterval(timer);

    teamA = randomAmount();
    teamB = randomAmount();

    matchTime = 30;

    document.getElementById("status").innerHTML =
        "🟢 OPEN";

    document.getElementById("timer").innerHTML =
        matchTime;

    document.getElementById("selection").innerHTML =
        "No team selected";

    document.getElementById("result").innerHTML =
        "";

    document.getElementById("betA").disabled =
        false;

    document.getElementById("betB").disabled =
        false;

    updateDisplay();


    timer = setInterval(function() {


        /* INCREASE DEMO CREDITS */

        teamA += Math.floor(
            Math.random() * 50000
        );

        teamB += Math.floor(
            Math.random() * 50000
        );


        matchTime--;


        document.getElementById("timer").innerHTML =
            matchTime;


        updateDisplay();


        /* CLOSE MATCH */

        if (matchTime <= 15) {

            document.getElementById("status").innerHTML =
                "🔴 CLOSED";

            document.getElementById("betA").disabled =
                true;

            document.getElementById("betB").disabled =
                true;

        }


        /* FINISH MATCH */

        if (matchTime <= 0) {

            clearInterval(timer);

            document.getElementById("status").innerHTML =
                "🏁 GAME FINISHED";

            document.getElementById("result").innerHTML =
                "Match Completed";


            setTimeout(function() {

                startMatch();

            }, 3000);

        }

    }, 1000);

}


/* UPDATE AMOUNTS */

function updateDisplay() {

    document.getElementById("teamA").innerHTML =
        teamA.toLocaleString();

    document.getElementById("teamB").innerHTML =
        teamB.toLocaleString();

}


/* SELECT TEAM */

function selectTeam(team) {

    document.getElementById("selection").innerHTML =
        "🎯 Selected: " +
        team +
        " — Demo Prediction";

}


/* START AUTOMATICALLY */

startMatch();

</script>

</body>
</html>
